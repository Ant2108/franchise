server:
  port: ${PORT:8085}

spring:
  application:
    name: warehouse-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: Asia/Ho_Chi_Minh

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:https://eureka-server-oonv.onrender.com/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:${HOSTNAME:localhost}}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${RENDER_EXTERNAL_HOSTNAME:${HOSTNAME:local}}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30