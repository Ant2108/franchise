server:
  port: ${PORT:8085}

spring:
  application:
    name: warehouse-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: Asia/Ho_Chi_Minh

eureka:
  client:
    service-url:
      defaultZone: https://eureka-server-oonv.onrender.com/eureka/
    fetch-registry: false
    register-with-eureka: false

  instance:
    prefer-ip-address: true